<!DOCTYPE html>
<html>
<head>
    <title>Employee Management</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            margin:40px;
        }

        table{
            width:70%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
            text-align:center;
        }

        th{
            background:#007BFF;
            color:white;
        }

        h1{
            color:#333;
        }

        a{
            text-decoration:none;
        }

        .btn{
            background:#28a745;
            color:white;
            padding:10px 18px;
            border-radius:5px;
        }

    </style>

</head>

<body>

<h1>Employee Management System</h1>

<br>

<a href="/add" class="btn">Add Employee</a>

<br><br>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Department</th>
</tr>

{% for emp in employees %}

<tr>

    <td>{{emp.id}}</td>

    <td>{{emp.name}}</td>

    <td>{{emp.department}}</td>

</tr>

{% endfor %}

</table>

<br>

<h3>Health Check</h3>

<a href="/health">/health</a>

<br>

<h3>Employee API</h3>

<a href="/api/employees">/api/employees</a>

</body>
</html>
