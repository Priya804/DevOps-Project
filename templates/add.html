<!DOCTYPE html>
<html>

<head>

<title>Add Employee</title>

<style>

body{

font-family:Arial;
background:#f4f4f4;
margin:40px;

}

form{

background:white;
padding:20px;
width:350px;
border-radius:10px;

}

input{

width:95%;
padding:10px;
margin:10px 0;

}

button{

background:#007BFF;
color:white;
padding:10px;
border:none;
cursor:pointer;
width:100%;

}

a{

text-decoration:none;

}

</style>

</head>

<body>

<h1>Add Employee</h1>

<form method="POST">

<label>Name</label>

<input
type="text"
name="name"
placeholder="Enter Employee Name"
required>

<label>Department</label>

<input
type="text"
name="department"
placeholder="Enter Department"
required>

<button type="submit">

Add Employee

</button>

</form>

<br>

<a href="/">← Back to Employee List</a>

</body>

</html>
